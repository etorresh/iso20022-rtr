[package]
name = "rtr-iso20022"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Emilio Torres"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regress = "0.11.1"

[workspace]
members = [
    ".",
    "tools/schema-to-rust",
    "tools/extract-fixtures",
    "tools/fixture-meta"
]

[dev-dependencies]
libtest-mimic = "0.8.2"
fixture-meta = {path = "tools/fixture-meta"}

[[test]]
name = "roundtrip"
harness = false
